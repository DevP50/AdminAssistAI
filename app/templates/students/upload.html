<!DOCTYPE html>
<html>
<head>
    <title>Upload</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <h1>Upload Student & Fee Records</h1>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      {% if category == 'success' %}
        <p style="color: green;">{{ message }}</p>
      {% else %}
        <p style="color: red;">{{ message }}</p>
      {% endif %}
    {% endfor %}
  {% endwith %}
  <form action="{{ url_for('students.handle_upload') }}" method="POST" enctype="multipart/form-data">
   <div class="upload-box">
    <label for="file">Choose Excel file:
     <p class="icon"></p>
     <p class="text">Drag and drop your file here or click to select</p>
     <p class="note">Only .xlsx and .xls files are accepted.</p>
     <input type="file" name="file" accept=".xlsx,.xls" id="file" required>
    </label>
  </div>
       <button type="submit" class="btn-submit">Upload</button>
  </form><!---File upload section-->
</body>
<style>
    .upload-box {
    max-width: 400px;
    margin: 50px auto;
   }

  .uploaded-box label{
    display: flex;
    flex-direction: row;
    align-items:center;
    justify-content: center;

    height: 250px;
    border: 2px dashed #4a90e2;
    border-radius: 10px;
    background-color: #f9fbfd;
    cursor: pointer;
   }

   .btn-submit{
     display: block;
     border-radius: 5px;
     background-color:#4a90e2;
     color:white;
     transition: background-color 0.2 ease
   }

   .btn-submit:hover{
    background-color: blue;
   }
   body{
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 0;
    padding: 20px;
   }
   .text{
    font-size: 16px;
    color: #212529;
   }
   .note{
    font-size: 14px;
    color: #6c757d;
   }
   :root {
  --ink-900: #16213e;
  --paper-100: #f7f3e9;
  --gold-500: #c9a227;
  --sage-500: #5f8a68;
  --rust-500: #a63d2d;
  --gold-600: #a8841c;
}

body {
  font-family: 'Inter', Arial, sans-serif;
  background: var(--paper-100);
  color: var(--ink-900);
  max-width: 900px;
  margin: 0 auto;
  padding: 24px;
}

h1, h2 { font-family: Georgia, serif; }

table { width: 100%; border-collapse: collapse; margin-top: 16px; }
th, td { padding: 10px; text-align: left; border: 1px solid #ddd; }
th { background: var(--ink-900); color: var(--paper-100); }

button, input[type="submit"] {
  background: var(--gold-500);
  color: var(--ink-900);
  border: none;
  padding: 6px 14px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 600;
}
button:hover { background: var(--gold-600); }

input[type="file"], input[type="number"] {
  padding: 6px;
  border: 1px solid #ccc;
  border-radius: 6px;
}
</style>
</html>
